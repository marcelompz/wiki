# Middlewares compartidos (seguridad). Se referencian desde los routers con:
#   middlewares:
#     - secure-headers
http:
  middlewares:
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        # CSP por defecto: restrictivo pero permite recursos propios, estilos inline
        # (muchos frameworks lo necesitan), y Cloudflare Insights.
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https:;
          font-src 'self' data: https://fonts.gstatic.com;
          connect-src 'self' http: https: ws: wss: https://cloudflareinsights.com https://*.cloudflareinsights.com;
          frame-ancestors 'self';
          base-uri 'self';
          form-action 'self'

    # Middleware para servicios que envían su propio CSP restrictivo desde el backend.
    # Sobreescribe el header CSP del upstream con uno compatible con Cloudflare.
    secure-headers-cloudflare:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          Cache-Control: "no-cache, no-store, must-revalidate, max-age=0"
          Pragma: "no-cache"
          Expires: "0"
          CDN-Cache-Control: "no-store"
          Cloudflare-CDN-Cache-Control: "no-store"
          # Sobreescribe cualquier CSP que venga del contenedor/backend.
          Content-Security-Policy: >-
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com;
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: https:;
            font-src 'self' data: https://fonts.gstatic.com;
            connect-src 'self' http: https: ws: wss: https://cloudflareinsights.com https://*.cloudflareinsights.com;
            frame-ancestors 'self';
            base-uri 'self';
            form-action 'self'

    vitalog-strip-api:
      stripPrefix:
        prefixes:
          - "/api"
